# The outside check. See worker.ts for what it does and why it has no URL.
#
# Deployed separately from the site, onto Cloudflare's own machines, which is
# the entire point: the server cannot report that it is off, and this does
# not run on the server.

name = "liquiditywise-uptime"
main = "worker.ts"
compatibility_date = "2026-09-01"

# No public address. The Worker has no fetch handler, so a workers.dev URL
# would answer nothing useful — and an address that does nothing is still an
# address to think about. Scheduled runs need none.
workers_dev = false

# Every five minutes, the same cadence as the server's own health check.
[triggers]
crons = ["*/5 * * * *"]

# Where the last verdict is kept between runs. The id is the namespace's own,
# filled in when the namespace is created — see deploy/README.md.
[[kv_namespaces]]
binding = "UPTIME"
id = "253aab4cf704475581515aafd617fd45"

# Every site this server hosts. Watching all of them is what lets a message
# say "the server" when they all go down together, and "this one site" when
# the others still answer. liquiditywise is asked at its health route, which
# a live app answers with 401 and which is never cached; the other two are
# asked at their home pages, cache-busted.
[vars]
SITES = """[
  { "name": "liquiditywise.com", "url": "https://liquiditywise.com/api/health" },
  { "name": "ensdesk.com", "url": "https://ensdesk.com/" },
  { "name": "splitstable.com", "url": "https://splitstable.com/" }
]"""

# SERVER_WATCH_BOT_TOKEN and TELEGRAM_OPERATOR_CHAT_ID are secrets and are not
# in this file. Set them with `wrangler secret put`, or in the dashboard. The
# token is Server Watch's, never the product bot's: a copy kept on Cloudflare
# should be one that can do nothing but report.
