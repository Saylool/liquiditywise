# A server block for an nginx that already serves other sites on this machine.
# Goes in /etc/nginx/sites-available/liquiditywise.com, symlinked into
# sites-enabled; nothing else changes. Port: the APP_PORT the service was
# installed with. TLS: certbot --nginx -d liquiditywise.com -d www.liquiditywise.com
# adds the certificate lines to this file; Cloudflare then runs Full (strict).
#
# The application counts rate-limit requests by X-Real-IP, and behind
# Cloudflare the visitor's address is CF-Connecting-IP — so that is handed on.

server {
    listen 80;
    listen [::]:80;
    server_name liquiditywise.com www.liquiditywise.com;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
