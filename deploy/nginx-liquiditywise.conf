# The one site block this application adds to an nginx that already serves
# others. It goes in /etc/nginx/sites-available/liquiditywise.com and is
# symlinked into sites-enabled; no other file changes. nginx routes by Host,
# and both names are named here, so nothing else on the machine is affected.
#
# certbot --nginx rewrites this file to add the 443 listeners, the certificate
# paths and the redirect from 80. Cloudflare then runs Full (strict), which
# checks that certificate on every connection.
#
# The application counts rate-limit requests by X-Real-IP, and behind
# Cloudflare the visitor's address is in CF-Connecting-IP — so that is what is
# handed on. Without it every visitor would be one of a few hundred edges, and
# the limit would be reached by strangers.

server {
    listen 80;
    listen [::]:80;
    server_name www.liquiditywise.com;

    # https, not http: certbot's own redirect would otherwise send a www
    # visitor through two hops to reach the same page.
    return 301 https://liquiditywise.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name liquiditywise.com;

    # Next streams its pages, so nothing here may buffer a response whole.
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
